name: Сборка для Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Анализ кода
        run: flutter analyze

      - name: Тесты
        run: flutter test

      - name: Сборка
        run: flutter build windows --release

      - name: Архив
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath my_barcode-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: my_barcode-windows
          path: my_barcode-windows.zip
          if-no-files-found: error

  release:
    # Релиз с архивом создаётся при пуше тега вида v1.0.0
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: my_barcode-windows
      - uses: softprops/action-gh-release@v2
        with:
          files: my_barcode-windows.zip
          generate_release_notes: true
